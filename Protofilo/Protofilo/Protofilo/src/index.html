<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MONEIM — Digital Universe</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The digital universe of Ahmed Moneim — Principal Software Engineer. Architecture, systems, and engineering.">
  <meta name="theme-color" content="#030409">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Font loading — Monument Extended for brand, Space Grotesk for display, Inter for body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Preload critical assets -->
  <link rel="preload" as="image" href="logo.png">

  <!-- Critical inline styles — prevents FOUC, shows intro immediately -->
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{background:#030409;color:#e8eaf0;overflow-x:hidden;-webkit-font-smoothing:antialiased}
    body{font-family:'Inter',sans-serif}
    app-root{display:block;min-height:100vh}
    .intro-fallback{position:fixed;inset:0;z-index:9999;background:#030409;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.5rem}
    .intro-fallback .wordmark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(2rem,6vw,4rem);letter-spacing:.15em;color:#e8eaf0;opacity:0;animation:wf-in .8s ease .3s forwards}
    .intro-fallback .sub{font-family:'JetBrains Mono',monospace;font-size:.5rem;letter-spacing:.3em;color:#4a5060;opacity:0;animation:wf-in .6s ease .8s forwards}
    @keyframes wf-in{to{opacity:1}}
  </style>
</head>
<body>
  <app-root>
    <!-- Fallback shown while Angular bootstraps -->
    <div class="intro-fallback">
      <div class="wordmark">MONEIM</div>
      <div class="sub">LOADING UNIVERSE</div>
    </div>
  </app-root>
</body>
</html>
