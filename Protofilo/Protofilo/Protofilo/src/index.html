<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MONEIM</title>
  <base href="/Protofilo/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ahmed Moneim — Principal Software Engineer. Architecture, systems, and digital craftsmanship.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="preload" as="image" href="logo.png">

  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{background:#ffffff;color:#1a1a2e;overflow-x:hidden;-webkit-font-smoothing:antialiased}
    body{font-family:'Inter',system-ui,sans-serif}
    app-root{display:block;min-height:100vh}
    .loader-fallback{position:fixed;inset:0;z-index:9999;background:#ffffff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;transition:opacity .4s ease}
    .loader-fallback .lf-wordmark{font-family:'Inter',sans-serif;font-weight:600;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:.18em;color:#1a1a2e}
    .loader-fallback .lf-bar{width:48px;height:2px;background:#e2e4ea;border-radius:1px;overflow:hidden}
    .loader-fallback .lf-bar::after{content:'';display:block;width:50%;height:100%;background:#6366f1;border-radius:1px;animation:lf-slide .8s ease-in-out infinite}
    @keyframes lf-slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  </style>
</head>
<body>
  <app-root>
    <div class="loader-fallback">
      <div class="lf-wordmark">MONEIM</div>
      <div class="lf-bar"></div>
    </div>
  </app-root>
</body>
</html>
